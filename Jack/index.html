<html>

<head>
    <!--Imports-->
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
    <script src="https://bgs3934.github.io/thumbstick-move.js "></script>
    <script src="https://unpkg.com/aframe-event-set-component@5.x.x/dist/aframe-event-set-component.min.js"></script>

        <!-- Camera rig and vr stuff -->
               <a-entity id="cameraRig" 
                movement-controls="controls: keyboard, gamepad, touch; speed: 0.3; constrainToNavMesh: false" 
                thumbstick-controls
                position="0 0 0">
        
                <a-entity id="head" camera look-controls position="0 1.6 0">
                    <a-entity 
                        cursor="fuse: false; rayOrigin: mouse" 
                        raycaster="objects: .clickable">
                    </a-entity>
                </a-entity>
                <a-entity id="leftHand" hand-controls="hand: left" hand-tracking-grab-controls="hand: left thumbstick-move teleport-controls="cameraRig: #cameraRig; teleportOrigin: #head; button: trigger"></a-entity>
                <a-entity id="rightHand" hand-controls="hand: right" hand-tracking-grab-controls="hand: right thumbstick-jump laser-controls="hand: right" raycaster="objects: .clickable"></a-entity>

                </a-entity>


        </a-entity>
