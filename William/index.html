<script>
  const counter = new ItemCounter();

  function updateHud() {
    document.getElementById("hudCounter")
            .setAttribute("value", "Items: " + counter.getCount());
  }

  document.addEventListener("DOMContentLoaded", () => {
    const items = document.querySelectorAll(".clickable");

    items.forEach(item => {
      item.addEventListener("click", () => {
        counter.add();
        updateHud();
      });
    });
  });
</script>

<script>
  let timeLeft = 180; // 3 minutes in seconds

  function updateTimer() {
    const minutes = Math.floor(timeLeft / 60);
    const seconds = timeLeft % 60;

    const formatted =
      (minutes < 10 ? "0" + minutes : minutes) + ":" +
      (seconds < 10 ? "0" + seconds : seconds);

    document.getElementById("hudTimer")
            .setAttribute("value", formatted);

    if (timeLeft > 0) {
      timeLeft--;
    } else {
      clearInterval(timer);
      document.getElementById("hudTimer")
              .setAttribute("value", "TIME UP!");
    }
  }

  const timer = setInterval(updateTimer, 1000);
</script>
