<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-event-set-component@5.x.x/dist/aframe-event-set-component.min.js"></script>
    <script src="https://unpkg.com/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>
    <script src="thumbstick-move.js"></script>
  </head>
  <body>



<a-scene>
  <!-- Load a glTF model -->
  <a-assets>
    <a-asset-item id="tree" src="Dazzling Wolt-Hillar.glb"></a-asset-item>
  </a-assets>

  <a-entity gltf-model="#tree" position="0 0 -10" scale="0.05 0.05 0.05"></a-entity>
  <a-sky color="#BFDFF0"></a-sky>
  <a-plane position="0 0 -4" rotation="-90 0 0" width="400" height="400" color="#7BC8A4"></a-plane>
</a-scene>

  </body>
</html>
