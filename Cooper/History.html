<!DOCTYPE html>
<!-- saved from url=(0017)chrome://history/ -->
<html dir="ltr" lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <!--<base href="chrome://history">--><base href=".">
  
  <meta name="color-scheme" content="light dark">
  <title>History</title>

  <link rel="stylesheet" href="chrome://resources/css/md_colors.css">

  <style>
    html {
      /* Remove 300ms delay for 'click' event, when using touch interface. */
      touch-action: manipulation;
    }

    html,
    body {
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      cursor: default;
    }

    @media (prefers-color-scheme: dark) {
      html {
        background: var(--md-background-color);
      }
    }

    /* Minimal styling required to display app shim. */
    .loading history-app {
      visibility: hidden;
    }

    #app-shim {
      display: none;
    }

    .loading #app-shim {
      display: block;
      position: absolute;
      inset: 0;
      font-size: 123%;
      color: var(--md-loading-message-color);
      font-weight: 500;
      align-content: center;
      text-align: center;
    }
  </style>
</head>
<body class="loading">
  <history-app id="history-app"></history-app>
  <div id="app-shim">Loading…</div>
  <link rel="stylesheet" href="chrome://resources/css/text_defaults_md.css">
  <script type="module" src="chrome://history/history.js"></script>


</body></html>
