  <style>
    #timer {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      font-family: Arial, sans-serif;
      font-size: 48px;
      color: white;
      background: rgba(30, 175, 110, 0.5);
      padding: 10px 20px;
      border-radius: 10px;
      z-index: 100;
    }
  </style>

  <script>
    let score = 0;

    AFRAME.registerComponent('score-display', {
      init: function() {
        this.updateDisplay();
      },
      updateDisplay: function() {
        this.el.setAttribute(
          'text',
          'value: Score: ' + score + '; color: #000; align: center; width: 4'
        );
      },
      addPoint: function() {
        score++;
        this.updateDisplay();
      }
    });

    AFRAME.registerComponent('pickup', {
      init: function() {
        var box = this.el;

        box.addEventListener('click', function() {
          var scoreEl = document.querySelector('#scoreBoard');

          if (scoreEl && scoreEl.components['score-display']) {
            scoreEl.components['score-display'].addPoint();
          }

          setTimeout(function() {
            box.remove();
          }, 2);
        });
      }
    });
  </script>

  <script>
    let timeLeft = 120;

    const timerDisplay = document.getElementById("timer");

    const countdown = setInterval(() => {
      timeLeft--;

      let mins = Math.floor(timeLeft / 60);
      let secs = timeLeft % 60;

      timerDisplay.innerHTML =
        `${mins}:${secs < 10 ? '0' : ''}${secs}`;

      if (timeLeft <= 0) {
        clearInterval(countdown);
        stopGame();
      }

    }, 1000);

    function stopGame() {
      timerDisplay.style.color = "red";
      timerDisplay.innerHTML = "GAME OVER";

      console.log("The game has stopped.");
    }
  </script>
