<html>
  <head>
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>
      <a-assets>
<a-asset-item id="pug" src="Characters Pug.glb"></a-asset-item>
  


      </a-assets>

      <a-entity gltf-model="#pug" scale="10 10 10" animation="property : position; to: 0 2 0; dur: 3000; loop: true; dir: alternate; "></a-entity>
      <a-box position="-1 0.5 -3" rotation="0 45 0" color="#4CC3D9" src="zebra.webp" animation="property : position; to: 0 2 0; dur: 3000; loop: true; dir: alternate; "></a-entity> ></a-box>
      <a-box position="2 0.5 -3" rotation="0 45 0" color="white" src="zebra.webp"></a-box>
      <a-sphere position="0 1.25 -5" radius="1.25" color="#EF2D5E" src="zebra.webp"></a-sphere>
       <a-sphere position="4 1.25 -10" radius="1.25" color="#EF2D5E" src="zebra.webp"></a-sphere>
      <a-cylinder position="1 0.75 -3" radius="0.5" height="1.5" color="#FFC65D" src="zebra.webp"></a-cylinder>
      <a-plane position="0 0 -4" rotation="-90 0 0" width="4" height="4" color="#7BC8A4"></a-plane>
      <a-sky color="" src="sky.jpg"></a-sky>
    </a-scene>
  </body>
</html>
