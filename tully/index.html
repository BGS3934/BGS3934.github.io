<html>
   <head>
<script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
<script src="https://bgs3934.github.io/thumbstick-move.js "></script>
</head>

<body>
   <a-scene>
      <a-assets>
        <a-asset-item id="Wave" src="Final Wave.glb"></a-asset-item> 

         </a-assets>
         <a-box color="#009fd7" scale="20 5 40" position="0 -5 0"></a-box>
         <a-entity gltf-model="#Wave" scale=".10 .10 .10" position="0 -2.5 -20" animation="property:position; to: 0 -2.5 16; dur:3000; loop: true; easing: linear;"></a-entity>
         <a-cylinder position="14 0 0" rotation="90 0 0" scale="5 40 5"></a-cylinder>
         <a-box position="14 -3 0" scale="10 8 40"></a-box> 
         <a-text color="black" value=" TURDNSURF" width="40" rotation="0 270 0" position="8.838 1.609 -2.347"></a-text>
         <a-text color="white" value="Turn around" width="100" rotation="0 180 0" position="0 0 80"></a-text> 
         <a-sky src="black.jpg"></a-sky>

         !-- Camera rig wrapper (This is an assembly of hands and head controls to allow both VR and keyboard / mouse control) --
      <a-entity id="cameraRig" 
                movement-controls="controls: keyboard, gamepad, touch; speed: 0.3; constrainToNavMesh: false" 
                thumbstick-controls
                position="0 0 0">
        <a-entity id="head" camera look-controls position="0 1.6 0">
            <a-entity 
              cursor="fuse: false; rayOrigin: mouse" 
              raycaster="objects: .clickable">
        </a-entity>
      </a-entity>
        <a-entity id="leftHand" hand-controls="hand: left" thumbstick-move teleport-controls="cameraRig: #cameraRig; teleportOrigin: #head; button: trigger"></a-entity>
        <a-entity id="rightHand" hand-controls="hand: right" thumbstick-jump laser-controls="hand: right" raycaster="objects: .clickable"></a-entity>
   </a-entity>
   </a-scene>
</body>



</html>
